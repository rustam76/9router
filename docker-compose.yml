services:
  9router:
    # Build from this repository's Dockerfile. A prebuilt `image:` (e.g.
    # decolua/9router:latest) would ignore every change in this repo, and
    # Coolify's Docker Compose build pack would redeploy that image unchanged.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  9router-data:
    name: 9router-data
